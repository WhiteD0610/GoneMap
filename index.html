<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">
<title>いった記録</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --sub:#8e8e93; --line:#e5e5ea;
  --accent:#ff9500; --danger:#ff3b30; --blue:#007aff; --green:#34c759;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --panel:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden}
#map{position:fixed;inset:0;z-index:0}

/* ===== ヘッダー ===== */
header{position:absolute;top:0;left:0;right:var(--panel);z-index:600;
  padding:calc(var(--safe-t) + 8px) 10px 8px;display:flex;gap:8px;align-items:center;
  background:linear-gradient(#f2f2f7ee,#f2f2f700);transition:right .26s}
.searchbox{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:11px;
  padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:520px}
.searchbox input{border:0;outline:0;flex:1;font-size:16px;background:transparent;min-width:0;font-family:inherit}
.iconbtn{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:11px;background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.iconbtn svg{width:21px;height:21px}
#syncDot{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:4px;background:var(--sub)}
#syncDot.ok{background:var(--green)} #syncDot.ng{background:var(--danger)}
#syncDot.busy{background:var(--blue);animation:bl .8s infinite alternate}
@keyframes bl{to{opacity:.25}}

/* ===== 吹き出しマーカー ===== */
.bub{position:relative;width:66px;height:66px;cursor:pointer}
.bub .ring{width:66px;height:66px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.bub .ring img{width:100%;height:100%;object-fit:cover;display:block}
.bub .ring .ph{font-size:26px}
.bub:hover .ring{transform:scale(1.06)}
.bub .tail{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:16px;height:12px;
  background:#fff;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.bub .dot{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:8px;height:8px;
  border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.bub.sel .ring{transform:scale(1.08)}

/* ===== FAB / クロスヘア ===== */
.fab{position:absolute;right:calc(var(--panel) + 16px);bottom:calc(var(--safe-b) + 22px);z-index:600;
  width:60px;height:60px;border:0;border-radius:30px;background:var(--accent);color:#fff;font-size:32px;
  line-height:1;box-shadow:0 6px 18px rgba(255,149,0,.45);cursor:pointer;transition:right .26s}
.locbtn{position:absolute;right:calc(var(--panel) + 16px);bottom:calc(var(--safe-b) + 94px);z-index:600;
  width:44px;height:44px;border:0;border-radius:22px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:right .26s}
.locbtn svg{width:20px;height:20px}
#cross{position:absolute;left:calc(50% - var(--panel)/2);top:50%;transform:translate(-50%,-100%);z-index:550;pointer-events:none;display:none}
#cross.show{display:block}
.crossPin{width:54px;height:54px;border-radius:50%;border:3px dashed var(--accent);
  background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:24px}
.crossTail{width:2px;height:16px;background:var(--accent);margin:0 auto}
#pickbar{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 16px);z-index:620;
  background:#fff;border-radius:16px;padding:12px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.22)}
#pickbar.show{display:block}
#pickbar p{margin:0 0 10px;font-size:13px;color:var(--sub);text-align:center}

/* ===== シート / パネル ===== */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:700;display:none}
.mask.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:750;background:var(--card);
  border-radius:20px 20px 0 0;transform:translateY(103%);
  transition:transform .26s cubic-bezier(.22,.8,.3,1),visibility .26s;
  visibility:hidden;pointer-events:none;
  max-height:72%;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.show{transform:translateY(0);visibility:visible;pointer-events:auto}
.sheet:not(.show){display:none!important}
.grip{width:44px;height:5px;background:#d1d1d6;border-radius:3px;margin:9px auto 4px;flex:0 0 auto;cursor:pointer}
.sheet .body{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 22px}
.sheet h2{font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  position:sticky;top:0;background:var(--card);padding:6px 0 10px;z-index:3}
.closeX{border:0;background:#e9e9ee;border-radius:14px;width:28px;height:28px;font-size:15px;cursor:pointer;color:var(--sub);flex:0 0 28px}

label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px}
input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--text);outline:0}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:76px;resize:vertical}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:600;
  background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(.96)}
.btn.sub{background:#e9e9ee;color:var(--text)}
.btn.danger{background:#ffe9e8;color:var(--danger)}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.photoBox{width:100%;aspect-ratio:4/3;border-radius:14px;background:#f2f2f7;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--sub);font-size:14px;cursor:pointer}
.photoBox img{width:100%;height:100%;object-fit:cover}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;
  cursor:pointer;font-family:inherit;color:var(--text)}
.cat.on{color:#fff;border-color:transparent}
#dPhoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#eee;display:block}
#dName{font-size:20px;font-weight:700;margin:12px 0 4px}
.meta{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:10px;color:#fff;font-size:12px}
#dMemo{margin:12px 0 0;white-space:pre-wrap;line-height:1.6;font-size:15px}
.item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:hover{background:#fafafa}
.item img,.item .noimg{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:0 0 58px;
  background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:22px}
.item .t{font-size:16px;font-weight:600}
.item .s{font-size:12px;color:var(--sub);margin-top:3px}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:14px}
.menuItem{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);
  padding:16px 4px;font-size:16px;font-family:inherit;color:var(--text);cursor:pointer}
.note{font-size:12px;color:var(--sub);line-height:1.7;white-space:pre-wrap;word-break:break-all}
.toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:900;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1}
.leaflet-control-attribution{font-size:9px}

/* ===== PC ===== */
@media (min-width:900px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:400px;max-height:none;border-radius:0;
    transform:translateX(103%);box-shadow:-4px 0 26px rgba(0,0,0,.12);padding-bottom:0}
  .sheet.show{transform:translateX(0)}
  .grip{display:none}
  .sheet .body{padding:18px 20px 40px}
  .sheet h2{margin-top:0}
  .mask{display:none!important}
  body.panelopen{--panel:400px}
  #pickbar{left:50%;right:auto;transform:translateX(-50%);width:460px}
  .toast{bottom:40px}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="cross"><div class="crossPin">📍</div><div class="crossTail"></div></div>

<header>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#8e8e93" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="text" placeholder="記録を検索 / 地名 / Googleマップのリンク" enterkeyhint="search">
  </div>
  <button class="iconbtn" id="btnList" title="一覧">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
  </button>
  <button class="iconbtn" id="btnSync" title="同期">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4"/><path d="M3 20v-4h4M21 4v4h-4"/></svg>
    <span id="syncDot"></span>
  </button>
  <button class="iconbtn" id="btnMenu" title="メニュー">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
  </button>
</header>

<button class="locbtn" id="btnLoc" title="現在地">
  <svg viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round"/></svg>
</button>
<button class="fab" id="btnAdd">＋</button>

<div id="pickbar">
  <p id="pickMsg">地図を動かす／地図をクリックして場所を合わせてください</p>
  <div class="row" style="margin:0 0 8px"><button class="btn sub" id="pickPaste">Googleマップのリンク・座標を貼る</button></div>
  <div class="row" style="margin:0">
    <button class="btn sub" id="pickCancel">やめる</button>
    <button class="btn" id="pickOk">ここにする</button>
  </div>
</div>

<div class="mask" id="mask"></div>

<!-- 入力 -->
<div class="sheet" id="sheetForm"><div class="grip"></div><div class="body">
  <h2><span id="formTitle">場所を記録</span><button class="closeX" data-close>✕</button></h2>
  <div class="photoBox" id="photoBox">クリックして写真を選ぶ</div>
  <input type="file" id="file" accept="image/*" hidden>
  <label>場所・店の名前</label>
  <input type="text" id="fName" placeholder="例）〇〇カフェ">
  <label>カテゴリ</label>
  <div class="cats" id="cats"></div>
  <label>行った日</label>
  <input type="date" id="fDate">
  <label>メモ</label>
  <textarea id="fMemo" placeholder="食べたもの、感想、また行きたいか など"></textarea>
  <label>GoogleマップのURL（登録すると詳細から直接開けます）</label>
  <input type="text" id="fMapUrl" placeholder="https://maps.app.goo.gl/… を貼り付け">
  <div class="row"><button class="btn sub" id="fFromUrl">このURLから位置を取り込む</button></div>
  <div class="row"><button class="btn sub" id="fPos">地図で位置を選び直す</button></div>
  <div class="row"><button class="btn" id="fSave">保存する</button></div>
</div></div>

<!-- 詳細 -->
<div class="sheet" id="sheetDetail"><div class="grip"></div><div class="body">
  <h2><span>記録</span><button class="closeX" data-close>✕</button></h2>
  <img id="dPhoto" alt="">
  <div id="dName"></div>
  <div class="meta"><span class="badge" id="dCat"></span><span id="dDate"></span></div>
  <div id="dMemo"></div>
  <div class="row">
    <button class="btn sub" id="dMap">マップで開く</button>
    <button class="btn sub" id="dRoute">経路</button>
    <button class="btn sub" id="dEdit">編集</button>
  </div>
  <div class="row"><button class="btn danger" id="dDel">削除する</button></div>
</div></div>

<!-- 一覧 -->
<div class="sheet" id="sheetList"><div class="grip"></div><div class="body">
  <h2><span>記録した場所 <span id="listCount" style="color:var(--sub);font-weight:400;font-size:14px"></span></span><button class="closeX" data-close>✕</button></h2>
  <div class="cats" id="filterCats" style="margin-bottom:6px"></div>
  <div id="listBody"></div>
</div></div>

<!-- 位置の貼り付け -->
<div class="sheet" id="sheetPaste"><div class="grip"></div><div class="body">
  <h2><span>リンク・座標から場所を指定</span><button class="closeX" data-close>✕</button></h2>
  <p class="note">Googleマップの「共有」リンク、アドレスバーのURL、緯度経度のどれでも貼り付けられます。</p>
  <label>貼り付け</label>
  <textarea id="pasteIn" placeholder="https://maps.app.goo.gl/xxxx&#10;https://www.google.com/maps/place/.../@35.6812,139.7671,17z&#10;35.6812, 139.7671"></textarea>
  <div class="row"><button class="btn" id="pasteGo">この場所を表示</button></div>
  <p class="note" id="pasteMsg" style="margin-top:12px"></p>
</div></div>

<!-- メニュー -->
<div class="sheet" id="sheetMenu"><div class="grip"></div><div class="body">
  <h2><span>メニュー</span><button class="closeX" data-close>✕</button></h2>
  <button class="menuItem" id="mAlbum">📖 アルバムで見る</button>
  <button class="menuItem" id="mSync">今すぐ同期する</button>
  <button class="menuItem" id="mPing">接続を確認する</button>
  <button class="menuItem" id="mExport">バックアップを書き出す（.json）</button>
  <button class="menuItem" id="mImport">バックアップを読み込む</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <label>同期の状態</label>
  <p class="note" id="syncInfo"></p>
  <p class="note" style="margin-top:14px">
    記録はまず端末内（IndexedDB）に保存され、同期を設定すると他の端末とも共有されます。<br>
    写真は長辺1400pxに圧縮して保存されます。
  </p>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== ここにGASのWebアプリURL（/exec で終わるもの）を貼る =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-j4R2WvIbrPzmpcMo2XtKJHKNEq5qOvsLpQvW17VhfZUHARSF9kf6Ttq_ew80tsr2cQ/exec';
// 同期の合言葉（GAS側の SYNC_KEY と同じ文字列に。全端末で共通）
const SYNC_KEY = '109344';
// アルバムアプリ（album.html）の場所。別リポジトリなら完全なURLを書く
const ALBUM_URL = 'album.html';
// ================================================================

/* ===================== 定数 ===================== */
const CATS = [
  {id:'food', name:'ごはん', color:'#ff9500', icon:'🍽'},
  {id:'cafe', name:'カフェ', color:'#a2845e', icon:'☕️'},
  {id:'spot', name:'観光',   color:'#34c759', icon:'⛩'},
  {id:'shop', name:'買い物', color:'#af52de', icon:'🛍'},
  {id:'other',name:'その他', color:'#007aff', icon:'📍'}
];
const catOf = id => CATS.find(c=>c.id===id) || CATS[4];
const isPC = () => window.matchMedia('(min-width:900px)').matches;

/* ===================== IndexedDB ===================== */
let db;
const openDB = () => new Promise((res,rej)=>{
  const r = indexedDB.open('placememo',2);
  r.onupgradeneeded = e => {
    const d = e.target.result;
    if(!d.objectStoreNames.contains('places')) d.createObjectStore('places',{keyPath:'id'});
  };
  r.onsuccess = e=>res(e.target.result); r.onerror = e=>rej(e.target.error);
});
const store = m => db.transaction('places',m).objectStore('places');
const dbAll = () => new Promise(r=>{ const q=store('readonly').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); });
const dbPut = o => new Promise((r,j)=>{ const q=store('readwrite').put(o); q.onsuccess=()=>r(); q.onerror=()=>j(q.error); });

/* ===================== 状態 ===================== */
let map, markerLayer, all = [], places = [], markers = {}, urlCache = {};
let editId=null, detailId=null, selectedId=null, pendingName='', pendingUrl='';
let pendingPos=null, pendingPhoto=null, pendingThumb=null, pickResolve=null, curCat='food', filterCat='';

/* ===================== 起動 ===================== */
(async function init(){
  try{ db = await openDB(); }catch(e){
    const local = location.protocol === 'file:';
    alert(
      '保存領域（IndexedDB）を開けませんでした。\n\n' +
      (local
        ? 'ファイルを直接開いている（file://）ため、ブラウザに拒否されています。\n' +
          '次のどちらかで開き直してください。\n' +
          '  ・このフォルダで  python -m http.server 8802  を実行し、http://localhost:8802/ を開く\n' +
          '  ・GitHub Pages などに置いて https:// で開く'
        : 'シークレットウィンドウ、サイトデータのブロック設定、または sandbox 付き iframe 内で\n' +
          '開かれている可能性があります。通常のウィンドウで開き直してください。') +
      '\n\n詳細: ' + e);
    return;
  }
  const saved = JSON.parse(localStorage.getItem('pm_view')||'null');
  map = L.map('map',{zoomControl:isPC()}).setView(saved?saved.c:[35.681,139.767], saved?saved.z:14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  map.on('moveend',()=>localStorage.setItem('pm_view',JSON.stringify({c:[map.getCenter().lat,map.getCenter().lng],z:map.getZoom()})));
  map.on('click', e=>{ if(pickResolve) map.panTo(e.latlng); });

  buildCats(); buildFilter();
  // 地図の描画領域がずれた場合に備えて常時追従
  window.addEventListener('resize', ()=>fixMap());
  window.addEventListener('orientationchange', ()=>fixMap(true));
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') fixMap(true); });
  document.addEventListener('focusout', ()=>fixMap(true));   // キーボードが閉じた後
  if(window.visualViewport){
    visualViewport.addEventListener('resize', ()=>fixMap());
    visualViewport.addEventListener('scroll', ()=>fixMap());
  }
  if(window.ResizeObserver) new ResizeObserver(()=>fixMap()).observe(document.body);
  fixMap(true);
  all = await dbAll(); refresh();
  updateSyncInfo();
  if(GAS_URL){ sync(); window.addEventListener('focus',()=>sync());
    setInterval(()=>{ if(document.visibilityState==='visible') sync(); }, 5*60*1000); }
  if(!places.length) toast('＋ボタンで最初の場所を記録しましょう');
})();

function refresh(){ places = all.filter(p=>!p.deleted); render(); }

/* 地図の実寸をpxで固定し、Leafletに再計算させる。
   ソフトキーボード表示中は縮んだ高さを掴まないようスキップし、閉じた後に効かせる */
let mapFixT = null;
function keyboardOpen(){
  const a = document.activeElement;
  return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
}
function fixMap(force){
  clearTimeout(mapFixT);
  const run = ()=>{
    if(!map) return;
    if(keyboardOpen() && !force) return;
    const el = document.getElementById('map');
    const h = Math.round(window.innerHeight);
    if(h > 200){ el.style.height = h+'px'; el.style.width = '100%'; }
    try{ map.invalidateSize({pan:false}); }catch(_){}
  };
  // 閉じるアニメーションやキーボードの収納を待って複数回実行
  [0,160,360,700].forEach(t=>setTimeout(run,t));
  mapFixT = setTimeout(run,1200);
}

/* ===================== マーカー ===================== */
function urlFor(p){
  if(urlCache[p.id]) return urlCache[p.id];
  if(!p.thumb) return null;
  return (urlCache[p.id] = URL.createObjectURL(p.thumb));
}
function dropUrl(id){ if(urlCache[id]){ URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; } }
function render(){
  markerLayer.clearLayers(); markers={};
  places.filter(p=>!filterCat || p.cat===filterCat).forEach(p=>{
    const c = catOf(p.cat), u = urlFor(p), sel = selectedId===p.id;
    const icon = L.divIcon({className:'',iconSize:[66,66],iconAnchor:[33,82],
      html:`<div class="bub${sel?' sel':''}">
        <div class="ring" style="border-color:${sel?c.color:'#fff'}">${u?`<img src="${u}" alt="">`:`<span class="ph">${c.icon}</span>`}</div>
        <div class="tail" style="background:${sel?c.color:'#fff'}"></div>
        <div class="dot" style="background:${c.color}"></div></div>`});
    const m = L.marker([p.lat,p.lng],{icon}).addTo(markerLayer);
    m.on('click',()=>openDetail(p.id));
    markers[p.id]=m;
  });
}

/* ===================== Googleマップ／座標の解析 ===================== */
function parseCoords(text){
  const s = decodeURIComponent(text.trim());
  let m;
  if((m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)))  return {lat:+m[1],lng:+m[2]};
  if((m = s.match(/[?&](?:q|query|ll|daddr|center|destination|sll)=(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/))) return {lat:+m[1],lng:+m[2]};
  if((m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)))      return {lat:+m[1],lng:+m[2]};
  if((m = s.match(/^\s*(-?\d{1,2}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)\s*$/))) return {lat:+m[1],lng:+m[2]};
  return null;
}
function nameFromMapsUrl(text){
  try{ const m = decodeURIComponent(text).match(/\/maps\/place\/([^\/@?]+)/);
       return m ? m[1].replace(/\+/g,' ').trim() : ''; }catch(_){ return ''; }
}
function queryName(u){
  try{
    const m = decodeURIComponent(u).match(/[?&](?:q|query)=([^&]+)/);
    if(!m) return '';
    const v = m[1].replace(/\+/g,' ').trim();
    return /^-?\d+\.\d+/.test(v) ? '' : v;
  }catch(_){ return ''; }
}
async function geocode(q, say){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    if(j[0]) return {lat:+j[0].lat, lng:+j[0].lon, name:q};
    say && say('見つかりませんでした。地図を直接動かして指定してください。');
  }catch(_){ say && say('検索に失敗しました。'); }
  return null;
}
async function resolvePlace(text, log){
  const say = t => { if(log) log(t); };
  const t = text.trim();
  let hit = parseCoords(t), name = nameFromMapsUrl(t);
  if(hit) return {...hit, name};

  if(/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl|g\.co|share\.google|maps\.google\.[a-z.]+|www\.google\.[a-z.]+)\//.test(t)){
    if(!GAS_URL){ say('短縮リンクの展開にはGAS（同期用）の設定が必要です。Googleマップでその場所を開き、アドレスバーの長いURL（/@35.6…,139.7… を含む）を貼ってください。'); return null; }
    say('リンクを展開中…');
    try{
      const r = await api('resolve',{url:t});
      const u = r.url||'';
      hit = (r.lat!=null ? {lat:+r.lat,lng:+r.lng} : null) || parseCoords(u);
      name = name || nameFromMapsUrl(u) || queryName(u) || (r.title||'');
      if(hit) return {...hit, name};
      if(name){ say('座標が取れないため「'+name+'」で検索します…'); return await geocode(name, say); }
      say('展開先: '+(u||'不明')+'\nここから場所を特定できませんでした。Googleマップで開き直し、共有→「リンクをコピー」ではなくアドレスバーのURL（/@35.6…,139.7… を含む）を貼ってください。');
      return null;
    }catch(e){ say('展開に失敗しました: '+e.message); return null; }
  }
  const q = name || t;
  say('「'+q+'」を検索中…');
  return await geocode(q, say);
}

  if(!r) return;
  const wasPicking = !!pickResolve;
  closeSheets();
  map.setView([r.lat,r.lng],18);
  pendingName = r.name||'';
  pendingUrl = /^https?:\/\//.test(t) ? t : '';

    document.getElementById('cross').classList.add('show');
    document.getElementById('pickbar').classList.add('show');
    document.getElementById('pickMsg').textContent = (r.name?`「${r.name}」`:'指定の位置')+'を表示しました。ずれていれば地図で微調整を';
  }else{
    await startAddAt({lat:r.lat,lng:r.lng});
  }
};

function setPhotoPreview(url){
  document.getElementById('photoBox').innerHTML = url?`<img src="${url}" alt="">`:'クリックして写真を選ぶ';
}
async function resize(file,max,q){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*s), h=Math.round(bmp.height*s);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h); bmp.close&&bmp.close();
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
}

  if(p.photo){ img.src=URL.createObjectURL(p.photo); img.style.display='block'; }

  else { img.removeAttribute('src'); img.style.display='none'; }
  document.getElementById('dName').textContent=p.name;
  const b=document.getElementById('dCat'); b.textContent=c.icon+' '+c.name; b.style.background=c.color;
  document.getElementById('dDate').textContent = p.date?p.date.replace(/-/g,'/'):'';
  document.getElementById('dMemo').textContent = p.memo||'';
  openSheet(document.getElementById('sheetDetail'));
  map.panTo([p.lat,p.lng]);
  if(!p.photo && p.photoId && GAS_URL){

    }catch(_){}

/* ===================== 同期 ===================== */
const b2d = b => b ? new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);}) : Promise.resolve(null);
const d2b = async d => d ? await (await fetch(d)).blob() : null;
async function api(action, payload, ms){
  const ac = new AbortController();
  const to = setTimeout(()=>ac.abort(), ms || 30000);
  try{
    const r = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:SYNC_KEY,action,...payload}), signal:ac.signal});
    const txt = await r.text();
    let j;
    try{ j = JSON.parse(txt); }
    catch(_){ throw new Error('応答がJSONではありません（HTTP '+r.status+'）。デプロイのアクセス権を「全員」にしてください'); }
    if(!j.ok) throw new Error(j.error||'不明なエラー');
    return j;
  }catch(e){
    if(e.name==='AbortError') throw new Error('応答がありません（タイムアウト）');
    throw e;
  }finally{ clearTimeout(to); }
}
function setSync(s,msg){
  document.getElementById('syncDot').className = s;
  localStorage.setItem('pm_syncmsg', msg||'');
  updateSyncInfo();
}
function updateSyncInfo(){
  const el=document.getElementById('syncInfo'); if(!el) return;
  if(!GAS_URL){ el.textContent='未設定（この端末内のみ保存）。コード冒頭の GAS_URL を設定すると他の端末と同期します。'; return; }
  const t=+localStorage.getItem('pm_synced')||0;
  el.textContent = (t?`最終同期: ${new Date(t).toLocaleString('ja-JP')}`:'未同期') + ' ' + (localStorage.getItem('pm_syncmsg')||'');
}
let syncing=false;
const PHOTOS_PER_SYNC = 3;     // 1回の同期で送る写真の最大枚数（詰まり防止）
async function sync(){
  if(!GAS_URL || syncing) return;
  syncing=true; setSync('busy','通信中…');
  try{
    all = await dbAll();
    const dirty = all.filter(p=>p.dirty);
    // 写真を先にDriveへ（重いので分割）
    const needUp = dirty.filter(p=>p.photo && !p.photoId);
    const upNow = needUp.slice(0, PHOTOS_PER_SYNC);
    for(let i=0;i<upNow.length;i++){
      const p = upNow[i];
      setSync('busy',`写真を送信中 ${i+1}/${upNow.length}`);
      toast(`写真を送信中 ${i+1}/${upNow.length}`);
      try{
        const r = await api('photo_put',{id:p.id, data: await b2d(p.photo)}, 60000);
        p.photoId = r.fileId; p.photoFail = 0; await dbPut(p);
      }catch(err){
        p.photoFail = (p.photoFail||0) + 1; await dbPut(p);
        toast('写真の送信に失敗: '+err.message);
        if(p.photoFail < 2) throw err;   // 2回目までは中断して原因を表示
      }
    }
    setSync('busy','記録を送信中…');
    const payload=[];
    const THUMB_LIMIT = 45000;   // スプレッドシートのセル上限(5万文字)に対する安全値
    for(const p of dirty){
      // 写真が送れていない記録は次回まわし。ただし2回失敗したら本体だけ先に送る
      if(p.photo && !p.photoId && (p.photoFail||0) < 2) continue;
      let th = (await b2d(p.thumb))||'';
      if(th.length > THUMB_LIMIT && p.thumb){            // 大きすぎるサムネは作り直す
        try{ p.thumb = await resize(p.thumb,140,.62); await dbPut(p); dropUrl(p.id);
             th = (await b2d(p.thumb))||''; }catch(_){ }
        if(th.length > THUMB_LIMIT) th = '';
      }
      payload.push({id:p.id,name:p.name,cat:p.cat,date:p.date,memo:p.memo,
        lat:p.lat,lng:p.lng,photoId:p.photoId||'',thumb:th,mapUrl:p.mapUrl||'',
        updatedAt:p.updatedAt,deleted:!!p.deleted});
    }
    const since=+localStorage.getItem('pm_since')||0;
    let res=null;
    if(payload.length){
      for(let i=0;i<payload.length;i+=6){
        const last = i+6>=payload.length;
        res = await api('sync',{since:last?since:null, changes:payload.slice(i,i+6)});
      }
    }else{
      res = await api('sync',{since, changes:[]});
    }
    let n=0;
    for(const c of (res.changes||[])){
      const local = all.find(x=>x.id===c.id);
      if(local && local.updatedAt >= +c.updatedAt) continue;
      const rec={id:c.id,name:c.name,cat:c.cat,date:c.date,memo:c.memo,lat:+c.lat,lng:+c.lng,
        photoId:c.photoId||null, thumb: await d2b(c.thumb), mapUrl:c.mapUrl||'',
        photo:(local && local.photoId && local.photoId===c.photoId)?local.photo:null,
        deleted:!!c.deleted, updatedAt:+c.updatedAt, dirty:false};
      await dbPut(rec); dropUrl(rec.id);
      const i=all.findIndex(x=>x.id===rec.id); if(i>=0) all[i]=rec; else all.push(rec); n++;
    }
    for(const p of dirty){ const cur=all.find(x=>x.id===p.id);
      if(cur && cur.dirty && cur.updatedAt===p.updatedAt && !(cur.photo && !cur.photoId && (cur.photoFail||0)<2)){ cur.dirty=false; await dbPut(cur); } }
    localStorage.setItem('pm_since', res.serverTime);
    localStorage.setItem('pm_synced', Date.now());
    refresh(); setSync('ok','');
    fillMissingThumbs();
    if(n) toast(`${n}件を他の端末から受信しました`);
    const rest = (await dbAll()).filter(p=>p.dirty).length;
    if(rest){ setSync('busy',`残り${rest}件を送信中…`); syncing=false; setTimeout(sync, 800); return; }
  }catch(e){
    setSync('ng','エラー: '+e.message); console.warn('sync failed',e);
    toast('同期に失敗: '+e.message);
  }finally{ syncing=false; }
}
// サムネが無く photoId だけある記録を、Driveから取り直してサムネを作る
let filling=false;
async function fillMissingThumbs(){
  if(!GAS_URL || filling) return;
  filling = true;
  try{
    const targets = (await dbAll()).filter(p=>!p.deleted && !p.thumb && p.photoId).slice(0,8);
    for(const p of targets){
      try{
        const r = await api('photo_get',{fileId:p.photoId}, 45000);
        const blob = await d2b(r.data);
        if(!blob) continue;
        p.photo = blob;
        p.thumb = await resize(blob,180,.72);
        await dbPut(p); dropUrl(p.id);
        const i = all.findIndex(x=>x.id===p.id); if(i>=0) all[i]=p;
      }catch(_){ }
    }
    if(targets.length){ refresh(); }
  }finally{ filling=false; }
}

/* ===================== メニュー / バックアップ ===================== */
document.getElementById('btnMenu').onclick = ()=>{ updateSyncInfo(); openSheet(document.getElementById('sheetMenu')); };
document.getElementById('mPing').onclick = async ()=>{
  const el = document.getElementById('syncInfo');
  if(!GAS_URL){ el.textContent = 'GAS_URL が空です。コード冒頭に /exec URL を貼ってください。'; return; }
  el.textContent = '接続を確認しています…';
  const t0 = Date.now();
  const un = (await dbAll()).filter(p=>p.dirty).length;
  try{
    const r = await api('diag',{},20000);
    const lines = [`接続OK（${Date.now()-t0}ms）／未送信 ${un}件`];
    if(r.sheetError) lines.push('★シートに書き込めません: '+r.sheetError+
      '\n→ GASエディタで関数 setup を1回実行し、アクセス権限を承認してください');
    else lines.push(`シート「${r.sheetName}」に ${r.rows}件\n${r.sheetUrl}`);
    if(r.folderError) lines.push('★Driveに書き込めません: '+r.folderError);
    else if(r.folderName) lines.push(`写真フォルダ: ${r.folderName}`);
    el.textContent = lines.join('\n');
  }catch(e){
    if(/unknown action/.test(e.message))
      el.textContent = 'GASが古いバージョンのままです。\n「デプロイを管理 → 編集 → バージョン: 新バージョン → デプロイ」で更新してください。';
    else
      el.textContent = '接続NG: ' + e.message + '\nURL: ' + GAS_URL.slice(0,70) + '…';
  }
};
document.getElementById('mAlbum').onclick = ()=>{ location.href = ALBUM_URL; };
document.getElementById('mExport').onclick = async ()=>{
  toast('書き出し中…');
  const out=[];
  for(const p of all) out.push({...p, photo:await b2d(p.photo), thumb:await b2d(p.thumb)});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({v:2,places:out})],{type:'application/json'}));
  a.download=`placememo_${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
document.getElementById('mImport').onclick = ()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); let n=0;
    for(const p of (j.places||[])){
      const rec={...p, photo:await d2b(p.photo), thumb:await d2b(p.thumb),
        updatedAt:p.updatedAt||Date.now(), deleted:!!p.deleted, dirty:true};
      if(all.some(x=>x.id===rec.id)) rec.id=rec.id+'_i'+Math.random().toString(36).slice(2,5);
      await dbPut(rec); all.push(rec); n++;
    }
    refresh(); closeSheets(); toast(`${n}件読み込みました`);
    if(GAS_URL) sync();
  }catch(_){ toast('読み込めませんでした'); }
  e.target.value='';
};
